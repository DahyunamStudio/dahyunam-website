<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استودیو دَهیونام</title>
<link rel="icon" href="assets/dahyunam-logo.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img data-studio-logo src="assets/dahyunam-logo.png" alt="لوگو">
      <span class="brand-name" data-studio-name>استودیو</span>
    </a>
  </div>
</header>

<div class="wrap">
  <div class="page-title-row">
    <button class="back-btn" data-back type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      بازگشت
    </button>
  </div>
  <div class="page-title-row" style="padding-top:14px;">
    <h1>مقالات و آموزش‌ها</h1>
    <p>مجموعه‌ی کامل مطالب آموزشی استودیو در یک صفحه</p>
  </div>

  <div class="search-box">
    <input id="article-search" type="text" placeholder="جست‌وجو بر اساس عنوان مقاله...">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </div>

  <div class="scroll-area">
    <div class="article-list" id="all-articles-grid"></div>
    <div class="empty-state" id="articles-empty" style="display:none;">مقاله‌ای با این عنوان پیدا نشد.</div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap" data-footer-text></div>
</footer>

<script src="js/main.js"></script>
<script>initArticlesPage();</script>
</body>
</html>
